<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finanzas Personales</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 10px; /* Reducido para móviles */
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1); /* Reducida para móviles */
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #4CAF50, #45a049);
            color: white;
            padding: 20px 15px; /* Reducido para móviles */
            text-align: center;
            position: relative;
        }

        .header h1 {
            font-size: 1.8em; /* Reducido para móviles */
            margin-bottom: 15px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header-controls {
            display: flex;
            justify-content: center;
            gap: 10px; /* Reducido para móviles */
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .control-btn {
            padding: 8px 15px; /* Reducido para móviles */
            border: none;
            border-radius: 8px;
            font-size: 0.9em; /* Reducido para móviles */
            cursor: pointer;
            background: #2E7D32;
            color: white;
            transition: all 0.3s ease;
            font-weight: bold;
            min-width: auto; /* Permitir que se ajuste al contenido */
        }

        .control-btn:hover {
            background: #1B5E20;
            transform: translateY(-2px);
        }

        .total-display {
            background: rgba(255,255,255,0.2);
            padding: 15px; /* Reducido para móviles */
            border-radius: 10px;
            margin-top: 15px;
        }

        .total-display h2 {
            font-size: 1em; /* Reducido para móviles */
            margin-bottom: 5px;
        }

        .total-amount {
            font-size: 2em; /* Reducido para móviles */
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .main-content {
            padding: 20px 15px; /* Reducido para móviles */
        }

        .accounts-section {
            margin-bottom: 30px;
        }

        .accounts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); /* Ajustado para móviles */
            gap: 15px; /* Reducido para móviles */
            margin-bottom: 20px;
        }

        .account-panel {
            background: #e8f5e8;
            border: 2px solid #4CAF50; /* Reducido para móviles */
            border-radius: 10px;
            padding: 15px; /* Reducido para móviles */
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            min-height: 100px; /* Reducido para móviles */
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
        }

        .account-panel:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(76, 175, 80, 0.3);
        }

        .account-panel.add-panel {
            background: #f0f0f0;
            border: 2px dashed #ccc; /* Reducido para móviles */
            color: #666;
        }

        .account-name {
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 1em; /* Reducido para móviles */
        }

        .account-balance {
            font-size: 1.4em; /* Reducido para móviles */
            font-weight: bold;
            color: #2E7D32;
        }

        .delete-account {
            position: absolute;
            top: 5px;
            right: 5px;
            background: #f44336;
            color: white;
            border: none;
            border-radius: 50%;
            width: 20px; /* Reducido para móviles */
            height: 20px; /* Reducido para móviles */
            cursor: pointer;
            font-size: 0.7em; /* Reducido para móviles */
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .actions-section {
            display: flex;
            gap: 10px; /* Reducido para móviles */
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }

        .action-btn {
            padding: 12px 20px; /* Reducido para móviles */
            border: none;
            border-radius: 8px;
            font-size: 1em; /* Reducido para móviles */
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 100px; /* Reducido para móviles */
            flex: 1; /* Para que ocupen espacio disponible */
            max-width: 200px; /* Límite máximo */
        }

        .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.2);
        }

        .btn-ingreso {
            background: #4CAF50;
            color: white;
        }

        .btn-debito {
            background: #f44336;
            color: white;
        }

        .btn-transferir {
            background: #2196F3;
            color: white;
        }

        .payments-section {
            background: #f9f9f9;
            border-radius: 12px;
            padding: 20px 15px; /* Reducido para móviles */
            position: relative;
            overflow-x: auto; /* Para permitir scroll horizontal en tablas */
        }

        .payments-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .payments-header h2 {
            font-size: 1.3em; /* Reducido para móviles */
        }

        .payments-controls {
            display: flex;
            gap: 8px; /* Reducido para móviles */
            flex-wrap: wrap;
        }

        .payments-table {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
            min-width: 600px; /* Mínimo para que la tabla sea legible */
        }

        .table-header {
            background: #333;
            color: white;
            display: grid;
            grid-template-columns: 1.5fr 1fr 1fr 1fr 1fr 0.8fr; /* Ajustado para móviles */
            gap: 1px;
            font-size: 0.8em; /* Reducido para móviles */
        }

        .header-cell, .table-cell {
            padding: 10px 5px; /* Reducido para móviles */
            text-align: center;
            font-weight: bold;
            word-break: break-word; /* Para evitar desbordamiento */
        }

        .table-row {
            display: grid;
            grid-template-columns: 1.5fr 1fr 1fr 1fr 1fr 0.8fr; /* Ajustado para móviles */
            gap: 1px;
            background: #f0f0f0;
        }

        .table-cell {
            background: white;
            font-weight: normal;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85em; /* Reducido para móviles */
        }

        .payment-item {
            font-weight: bold;
        }

        .cuota-cell {
            cursor: pointer;
            background: #e3f2fd;
            transition: all 0.3s ease;
            padding: 8px 5px; /* Ajustado para móviles */
        }

        .cuota-cell:hover {
            background: #bbdefb;
        }

        .status-en-espera {
            background: #fff3cd;
            color: #856404;
            padding: 6px 10px; /* Reducido para móviles */
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.8em; /* Reducido para móviles */
        }

        .status-pagado {
            background: #d4edda;
            color: #155724;
            padding: 6px 10px; /* Reducido para móviles */
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.8em; /* Reducido para móviles */
        }

        .delete-payment {
            background: #f44336;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 4px 8px; /* Reducido para móviles */
            cursor: pointer;
            font-size: 0.7em; /* Reducido para móviles */
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            padding: 10px; /* Para móviles */
            overflow-y: auto;
        }

        .modal-content {
            background-color: white;
            margin: 5% auto;
            padding: 20px; /* Reducido para móviles */
            border-radius: 12px;
            width: 95%; /* Más ancho en móviles */
            max-width: 500px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h3 {
            font-size: 1.2em; /* Reducido para móviles */
        }

        .close {
            font-size: 24px; /* Reducido para móviles */
            font-weight: bold;
            cursor: pointer;
            color: #999;
        }

        .close:hover {
            color: #333;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
            font-size: 0.9em; /* Reducido para móviles */
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 10px; /* Reducido para móviles */
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 1em;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #4CAF50;
        }

        .modal-actions {
            display: flex;
            gap: 10px; /* Reducido para móviles */
            justify-content: flex-end;
            flex-wrap: wrap;
        }

        .btn-confirm, .btn-cancel {
            padding: 10px 20px; /* Reducido para móviles */
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9em; /* Reducido para móviles */
            flex: 1; /* Para que ocupen espacio disponible */
            min-width: 100px; /* Mínimo para que sean tappables */
        }

        .btn-confirm {
            background: #4CAF50;
            color: white;
        }

        .btn-cancel {
            background: #f44336;
            color: white;
        }

        .date-inputs {
            display: flex;
            gap: 8px; /* Reducido para móviles */
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .month-selector {
            padding: 8px 10px; /* Reducido para móviles */
            border: 2px solid #ddd;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.9em; /* Reducido para móviles */
        }

        .historial-section {
            margin-top: 25px;
            background: white;
            border-radius: 8px;
            padding: 15px; /* Reducido para móviles */
        }

        .historial-section h3 {
            font-size: 1.2em; /* Reducido para móviles */
            margin-bottom: 10px;
        }

        .historial-item {
            padding: 8px 10px; /* Reducido para móviles */
            margin-bottom: 5px;
            background: #f8f9fa;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85em; /* Reducido para móviles */
            flex-wrap: wrap;
        }

        .backup-section {
            margin-top: 25px;
            background: #f9f9f9;
            border-radius: 8px;
            padding: 15px; /* Reducido para móviles */
        }

        .backup-section h3 {
            font-size: 1.2em; /* Reducido para móviles */
            margin-bottom: 10px;
        }

        .backup-section p {
            font-size: 0.9em; /* Reducido para móviles */
            margin-bottom: 10px;
        }

        .backup-controls {
            display: flex;
            gap: 10px; /* Reducido para móviles */
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .backup-btn {
            padding: 8px 15px; /* Reducido para móviles */
            border: none;
            border-radius: 6px;
            font-size: 0.9em; /* Reducido para móviles */
            cursor: pointer;
            background: #2E7D32;
            color: white;
            transition: all 0.3s ease;
            font-weight: bold;
            flex: 1; /* Para que ocupen espacio disponible */
            min-width: 120px; /* Mínimo para que sean tappables */
        }

        .backup-btn:hover {
            background: #1B5E20;
        }

        /* Media Queries para diferentes tamaños de pantalla */
        @media (max-width: 768px) {
            .table-header, .table-row {
                grid-template-columns: 1.5fr 0.8fr 0.8fr 0.8fr 1fr 0.8fr;
            }
            
            .header-cell, .table-cell {
                padding: 8px 4px;
                font-size: 0.75em;
            }

            .actions-section {
                flex-direction: column;
                align-items: center;
            }

            .action-btn {
                width: 100%;
                max-width: 300px;
            }

            .header-controls {
                flex-direction: column;
                align-items: center;
            }
            
            .control-btn {
                width: 100%;
                max-width: 250px;
            }
            
            .payments-header {
                flex-direction: column;
                align-items: flex-start;
            }
            
            .payments-controls {
                width: 100%;
                justify-content: center;
                margin-top: 10px;
            }
            
            .modal-actions {
                flex-direction: column;
            }
            
            .btn-confirm, .btn-cancel {
                width: 100%;
            }
        }

        @media (max-width: 480px) {
            .accounts-grid {
                grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
                gap: 10px;
            }
            
            .account-panel {
                padding: 10px;
                min-height: 90px;
            }
            
            .account-name {
                font-size: 0.9em;
            }
            
            .account-balance {
                font-size: 1.2em;
            }
            
            .header h1 {
                font-size: 1.5em;
            }
            
            .total-amount {
                font-size: 1.8em;
            }
            
            .payments-table {
                min-width: 500px; /* Aún más pequeño para móviles muy pequeños */
            }
            
            .historial-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 5px;
            }
        }

        @media (max-width: 360px) {
            body {
                padding: 5px;
            }
            
            .container {
                border-radius: 10px;
            }
            
            .header {
                padding: 15px 10px;
            }
            
            .main-content {
                padding: 15px 10px;
            }
            
            .accounts-grid {
                grid-template-columns: 1fr 1fr;
            }
            
            .payments-table {
                min-width: 450px;
            }
        }
    </style>
</head>
<body>
    <!-- El resto del código HTML permanece exactamente igual -->
    <div class="container">
        <div class="header">
            <h1>FINANZAS PERSONALES</h1>
            <div class="header-controls">
                <button class="control-btn" onclick="resetAccounts()">REINICIAR SALDOS</button>
                <button class="control-btn" onclick="exportToCSV()">EXPORTAR CSV</button>
                <button class="control-btn" onclick="backupData()">CREAR BACKUP</button>
                <button class="control-btn" onclick="restoreBackup()">RESTAURAR BACKUP</button>
            </div>
            <div class="total-display">
                <h2>TOTAL DISPONIBLE</h2>
                <div class="total-amount" id="totalAmount">$0.00</div>
            </div>
        </div>

        <div class="main-content">
            <div class="accounts-section">
                <div class="accounts-grid" id="accountsGrid">
                    <!-- Las cuentas se generarán dinámicamente -->
                </div>

                <div class="actions-section">
                    <button class="action-btn btn-ingreso" onclick="openModal('ingreso')">INGRESO</button>
                    <button class="action-btn btn-debito" onclick="openModal('debito')">DÉBITO</button>
                    <button class="action-btn btn-transferir" onclick="openModal('transferir')">TRANSFERIR</button>
                </div>
            </div>

            <div class="payments-section">
                <div class="payments-header">
                    <h2>PAGOS RECURRENTES</h2>
                    <div class="payments-controls">
                        <button class="control-btn" onclick="addRecurringPayment()">AGREGAR PAGO</button>
                        <button class="control-btn" onclick="clearAllPayments()">LIMPIAR PAGOS</button>
                    </div>
                </div>
                <div class="date-inputs">
                    <select class="month-selector" id="monthSelector" onchange="updateMonth()">
                        <!-- Los meses se generarán dinámicamente -->
                    </select>
                </div>

                <div class="payments-table">
                    <div class="table-header">
                        <div class="header-cell">PAGO</div>
                        <div class="header-cell">1RA CUOTA<br><span id="fecha1">15/09/2025</span></div>
                        <div class="header-cell">2DA CUOTA<br><span id="fecha2">30/09/2025</span></div>
                        <div class="header-cell">TOTAL MES<br><span id="mesActual">SEPTIEMBRE</span></div>
                        <div class="header-cell">ESTADO</div>
                        <div class="header-cell">ELIMINAR</div>
                    </div>

                    <div id="paymentsTableBody">
                        <!-- Los pagos se generarán dinámicamente -->
                    </div>
                </div>
            </div>

            <div class="backup-section">
                <h3>GESTIÓN DE BACKUP</h3>
                <p>Aquí puedes crear y restaurar copias de seguridad de tus datos financieros.</p>
                <div class="backup-controls">
                    <button class="backup-btn" onclick="backupToFile()">DESCARGAR BACKUP</button>
                    <button class="backup-btn" onclick="restoreFromFile()">CARGAR BACKUP</button>
                    <button class="backup-btn" onclick="clearAllData()">LIMPIAR TODOS LOS DATOS</button>
                </div>
            </div>

            <div class="historial-section">
                <h3>HISTORIAL RECIENTE</h3>
                <div id="historialContainer">
                    <!-- El historial se llenará dinámicamente -->
                </div>
            </div>
        </div>
    </div>

    <!-- Modal para acciones -->
    <div id="actionModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">Acción</h3>
                <span class="close" onclick="closeModal()">&times;</span>
            </div>
            <div id="modalBody">
                <!-- El contenido se llenará dinámicamente -->
            </div>
        </div>
    </div>

    <!-- Modal para editar cuenta -->
    <div id="editAccountModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="editAccountTitle">Editar Cuenta</h3>
                <span class="close" onclick="closeEditAccountModal()">&times;</span>
            </div>
            <div id="editAccountBody">
                <!-- El contenido se llenará dinámicamente -->
            </div>
        </div>
    </div>

    <script>
        // El código JavaScript permanece exactamente igual
        // Estado global de la aplicación
        let appState = {
            accounts: {},
            payments: {},
            history: [],
            currentMonth: new Date().getMonth(),
            currentYear: new Date().getFullYear()
        };

        // Inicializar la aplicación
        function initApp() {
            loadState();
            generateMonthOptions();
            updateMonth();
            updateAccountsDisplay();
            updateTotalAmount();
            updatePaymentsTable();
            updateHistorial();
            
            // Agregar historial inicial si no hay datos
            if (appState.history.length === 0) {
                addToHistory('Sistema iniciado - Bienvenido a tu control financiero');
            }
        }

        // Generar opciones de meses
        function generateMonthOptions() {
            const monthSelector = document.getElementById('monthSelector');
            const months = [
                'ENERO', 'FEBRERO', 'MARZO', 'ABRIL', 'MAYO', 'JUNIO',
                'JULIO', 'AGOSTO', 'SEPTIEMBRE', 'OCTUBRE', 'NOVIEMBRE', 'DICIEMBRE'
            ];
            
            monthSelector.innerHTML = '';
            
            for (let i = 0; i < 12; i++) {
                const monthIndex = (appState.currentMonth + i) % 12;
                const year = appState.currentYear + Math.floor((appState.currentMonth + i) / 12);
                const option = document.createElement('option');
                option.value = months[monthIndex];
                option.textContent = `${months[monthIndex]} ${year}`;
                if (i === 0) option.selected = true;
                monthSelector.appendChild(option);
            }
        }

        // Actualizar mes
        function updateMonth() {
            const selector = document.getElementById('monthSelector');
            const selectedText = selector.options[selector.selectedIndex].textContent;
            const [monthName, year] = selectedText.split(' ');
            
            document.getElementById('mesActual').textContent = `${monthName} ${year}`;
            
            // Calcular fechas: 15 y 30 del mes seleccionado
            const monthIndex = [
                'ENERO', 'FEBRERO', 'MARZO', 'ABRIL', 'MAYO', 'JUNIO',
                'JULIO', 'AGOSTO', 'SEPTIEMBRE', 'OCTUBRE', 'NOVIEMBRE', 'DICIEMBRE'
            ].indexOf(monthName);
            
            const fecha1 = new Date(year, monthIndex, 15);
            const fecha2 = new Date(year, monthIndex, 30);
            
            // Formatear fechas
            document.getElementById('fecha1').textContent = formatDate(fecha1);
            document.getElementById('fecha2').textContent = formatDate(fecha2);
        }

        // Formatear fecha como DD/MM/YYYY
        function formatDate(date) {
            const day = String(date.getDate()).padStart(2, '0');
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const year = date.getFullYear();
            return `${day}/${month}/${year}`;
        }

        // Actualizar visualización de cuentas
        function updateAccountsDisplay() {
            const accountsGrid = document.getElementById('accountsGrid');
            accountsGrid.innerHTML = '';
            
            // Crear paneles para cada cuenta
            Object.keys(appState.accounts).forEach(accountName => {
                const panel = document.createElement('div');
                panel.className = 'account-panel';
                panel.setAttribute('data-account', accountName);
                panel.innerHTML = `
                    <button class="delete-account" onclick="deleteAccount('${accountName}')">X</button>
                    <div class="account-name">${accountName}</div>
                    <div class="account-balance">$${appState.accounts[accountName].toFixed(2)}</div>
                `;
                panel.onclick = () => openEditAccountModal(accountName);
                accountsGrid.appendChild(panel);
            });
            
            // Panel para agregar cuenta
            const addPanel = document.createElement('div');
            addPanel.className = 'account-panel add-panel';
            addPanel.onclick = addAccount;
            addPanel.innerHTML = '<div class="account-name">+ AGREGAR CUENTA</div>';
            accountsGrid.appendChild(addPanel);
        }

        // Actualizar monto total
        function updateTotalAmount() {
            const total = Object.values(appState.accounts).reduce((sum, amount) => sum + amount, 0);
            document.getElementById('totalAmount').textContent = `$${total.toFixed(2)}`;
        }

        // Agregar nueva cuenta
        function addAccount() {
            if (Object.keys(appState.accounts).length >= 10) {
                alert('Máximo 10 cuentas permitidas');
                return;
            }

            const name = prompt('Nombre de la nueva cuenta:')?.toUpperCase().trim();
            if (name && !appState.accounts[name]) {
                const amount = parseFloat(prompt('Saldo inicial:') || '0');
                appState.accounts[name] = amount;
                updateAccountsDisplay();
                updateTotalAmount();
                addToHistory(`Nueva cuenta: ${name} con $${amount.toFixed(2)}`);
                saveState();
            }
        }

        // Abrir modal para editar cuenta
        function openEditAccountModal(accountName) {
            const modal = document.getElementById('editAccountModal');
            const title = document.getElementById('editAccountTitle');
            const body = document.getElementById('editAccountBody');

            title.textContent = `EDITAR CUENTA: ${accountName}`;
            body.innerHTML = `
                <div class="form-group">
                    <label>Nombre de la cuenta:</label>
                    <input type="text" id="editAccountName" value="${accountName}">
                </div>
                <div class="form-group">
                    <label>Saldo:</label>
                    <input type="number" id="editAccountBalance" value="${appState.accounts[accountName]}" step="0.01">
                </div>
                <div class="modal-actions">
                    <button class="btn-confirm" onclick="saveAccountChanges('${accountName}')">GUARDAR</button>
                    <button class="btn-cancel" onclick="closeEditAccountModal()">CANCELAR</button>
                </div>
            `;

            modal.style.display = 'block';
        }

        // Guardar cambios en la cuenta
        function saveAccountChanges(oldAccountName) {
            const newName = document.getElementById('editAccountName').value.toUpperCase().trim();
            const newBalance = parseFloat(document.getElementById('editAccountBalance').value);

            if (newName && !isNaN(newBalance)) {
                // Si el nombre cambió, eliminar la cuenta vieja y crear una nueva
                if (newName !== oldAccountName) {
                    // Verificar que el nuevo nombre no exista
                    if (appState.accounts[newName]) {
                        alert('Ya existe una cuenta con ese nombre');
                        return;
                    }
                    
                    // Crear nueva cuenta y eliminar la vieja
                    appState.accounts[newName] = newBalance;
                    delete appState.accounts[oldAccountName];
                    
                    // Actualizar referencias en pagos
                    Object.keys(appState.payments).forEach(payment => {
                        if (appState.payments[payment].cuenta1 === oldAccountName) {
                            appState.payments[payment].cuenta1 = newName;
                        }
                        if (appState.payments[payment].cuenta2 === oldAccountName) {
                            appState.payments[payment].cuenta2 = newName;
                        }
                    });
                    
                    addToHistory(`Cuenta renombrada: ${oldAccountName} → ${newName} con saldo $${newBalance.toFixed(2)}`);
                } else {
                    // Solo actualizar el saldo
                    const oldBalance = appState.accounts[oldAccountName];
                    appState.accounts[oldAccountName] = newBalance;
                    addToHistory(`${oldAccountName}: saldo cambiado de $${oldBalance.toFixed(2)} a $${newBalance.toFixed(2)}`);
                }
                
                updateAccountsDisplay();
                updateTotalAmount();
                closeEditAccountModal();
                saveState();
            }
        }

        // Cerrar modal de edición de cuenta
        function closeEditAccountModal() {
            document.getElementById('editAccountModal').style.display = 'none';
        }

        // Eliminar cuenta
        function deleteAccount(accountName) {
            if (confirm(`¿Estás seguro de eliminar la cuenta ${accountName}?`)) {
                delete appState.accounts[accountName];
                updateAccountsDisplay();
                updateTotalAmount();
                addToHistory(`Cuenta eliminada: ${accountName}`);
                saveState();
            }
        }

        // Reiniciar saldos de cuentas
        function resetAccounts() {
            if (confirm('¿Estás seguro de reiniciar todos los saldos a cero?')) {
                Object.keys(appState.accounts).forEach(account => {
                    appState.accounts[account] = 0;
                });
                updateAccountsDisplay();
                updateTotalAmount();
                addToHistory('Todos los saldos reiniciados a cero');
                saveState();
            }
        }

        // Abrir modal
        function openModal(action) {
            const modal = document.getElementById('actionModal');
            const title = document.getElementById('modalTitle');
            const body = document.getElementById('modalBody');

            let titleText, bodyContent;

            switch(action) {
                case 'ingreso':
                    titleText = 'INGRESO DE DINERO';
                    bodyContent = `
                        <div class="form-group">
                            <label>Cuenta de destino:</label>
                            <select id="ingresoAccount">
                                ${Object.keys(appState.accounts).map(account => 
                                    `<option value="${account}">${account}</option>`
                                ).join('')}
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Monto:</label>
                            <input type="number" id="ingresoAmount" step="0.01" placeholder="0.00">
                        </div>
                        <div class="form-group">
                            <label>Descripción:</label>
                            <input type="text" id="ingresoDescription" placeholder="Ej: Salario, transferencia...">
                        </div>
                        <div class="modal-actions">
                            <button class="btn-confirm" onclick="processIngreso()">CONFIRMAR</button>
                            <button class="btn-cancel" onclick="closeModal()">CANCELAR</button>
                        </div>
                    `;
                    break;
                case 'debito':
                    titleText = 'DÉBITO DE DINERO';
                    bodyContent = `
                        <div class="form-group">
                            <label>Cuenta a debitar:</label>
                            <select id="debitoAccount">
                                ${Object.keys(appState.accounts).map(account => 
                                    `<option value="${account}">${account}</option>`
                                ).join('')}
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Monto:</label>
                            <input type="number" id="debitoAmount" step="0.01" placeholder="0.00">
                        </div>
                        <div class="form-group">
                            <label>Descripción:</label>
                            <input type="text" id="debitoDescription" placeholder="Ej: Compra, pago...">
                        </div>
                        <div class="modal-actions">
                            <button class="btn-confirm" onclick="processDebito()">CONFIRMAR</button>
                            <button class="btn-cancel" onclick="closeModal()">CANCELAR</button>
                        </div>
                    `;
                    break;
                case 'transferir':
                    titleText = 'TRANSFERIR DINERO';
                    bodyContent = `
                        <div class="form-group">
                            <label>DE (cuenta origen):</label>
                            <select id="transferFromAccount">
                                ${Object.keys(appState.accounts).map(account => 
                                    `<option value="${account}">${account}</option>`
                                ).join('')}
                            </select>
                        </div>
                        <div class="form-group">
                            <label>A (cuenta destino):</label>
                            <select id="transferToAccount">
                                ${Object.keys(appState.accounts).map(account => 
                                    `<option value="${account}">${account}</option>`
                                ).join('')}
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Monto:</label>
                            <input type="number" id="transferAmount" step="0.01" placeholder="0.00">
                        </div>
                        <div class="form-group">
                            <label>Descripción:</label>
                            <input type="text" id="transferDescription" placeholder="Ej: Separar para pago...">
                        </div>
                        <div class="modal-actions">
                            <button class="btn-confirm" onclick="processTransfer()">CONFIRMAR</button>
                            <button class="btn-cancel" onclick="closeModal()">CANCELAR</button>
                        </div>
                    `;
                    break;
            }

            title.textContent = titleText;
            body.innerHTML = bodyContent;
            modal.style.display = 'block';
        }

        // Abrir modal de cuota
        function openCuotaModal(paymentName, cuotaType, amount) {
            const modal = document.getElementById('actionModal');
            const title = document.getElementById('modalTitle');
            const body = document.getElementById('modalBody');

            title.textContent = `${paymentName} - ${cuotaType} CUOTA`;
            body.innerHTML = `
                <div class="form-group">
                    <label>Monto de la cuota:</label>
                    <input type="number" id="cuotaAmount" value="${amount}" step="0.01">
                </div>
                <div class="form-group">
                    <label>Transferir DE:</label>
                    <select id="cuotaFromAccount">
                        ${Object.keys(appState.accounts).map(account => 
                            `<option value="${account}">${account}</option>`
                        ).join('')}
                    </select>
                </div>
                <div class="form-group">
                    <label>Transferir A:</label>
                    <select id="cuotaToAccount">
                        ${Object.keys(appState.accounts).map(account => 
                            `<option value="${account}">${account}</option>`
                        ).join('')}
                    </select>
                </div>
                <div class="modal-actions">
                    <button class="btn-confirm" onclick="processCuota('${paymentName}', '${cuotaType}')">TRANSFERIR CUOTA</button>
                    <button class="btn-cancel" onclick="closeModal()">CANCELAR</button>
                </div>
            `;

            modal.style.display = 'block';
        }

        // Procesar ingreso
        function processIngreso() {
            const account = document.getElementById('ingresoAccount').value;
            const amount = parseFloat(document.getElementById('ingresoAmount').value);
            const description = document.getElementById('ingresoDescription').value;

            if (amount > 0) {
                appState.accounts[account] += amount;
                updateAccountsDisplay();
                updateTotalAmount();
                addToHistory(`INGRESO: +$${amount.toFixed(2)} → ${account} (${description})`);
                closeModal();
                saveState();
            }
        }

        // Procesar débito
        function processDebito() {
            const account = document.getElementById('debitoAccount').value;
            const amount = parseFloat(document.getElementById('debitoAmount').value);
            const description = document.getElementById('debitoDescription').value;

            if (amount > 0 && appState.accounts[account] >= amount) {
                appState.accounts[account] -= amount;
                updateAccountsDisplay();
                updateTotalAmount();
                addToHistory(`DÉBITO: -$${amount.toFixed(2)} ← ${account} (${description})`);
                closeModal();
                saveState();
            } else {
                alert('Saldo insuficiente');
            }
        }

        // Procesar transferencia
        function processTransfer() {
            const fromAccount = document.getElementById('transferFromAccount').value;
            const toAccount = document.getElementById('transferToAccount').value;
            const amount = parseFloat(document.getElementById('transferAmount').value);
            const description = document.getElementById('transferDescription').value;

            if (amount > 0 && fromAccount !== toAccount && appState.accounts[fromAccount] >= amount) {
                appState.accounts[fromAccount] -= amount;
                appState.accounts[toAccount] += amount;
                updateAccountsDisplay();
                updateTotalAmount();
                addToHistory(`TRANSFERENCIA: $${amount.toFixed(2)} de ${fromAccount} → ${toAccount} (${description})`);
                closeModal();
                saveState();
            } else {
                alert('Error en la transferencia. Verifique saldo y cuentas.');
            }
        }

        // Procesar cuota
        function processCuota(paymentName, cuotaType) {
            const fromAccount = document.getElementById('cuotaFromAccount').value;
            const toAccount = document.getElementById('cuotaToAccount').value;
            const amount = parseFloat(document.getElementById('cuotaAmount').value);

            if (amount > 0 && fromAccount !== toAccount && appState.accounts[fromAccount] >= amount) {
                appState.accounts[fromAccount] -= amount;
                appState.accounts[toAccount] += amount;
                
                // Guardar información de la cuota
                if (cuotaType === '1RA') {
                    appState.payments[paymentName].cuenta1 = toAccount;
                } else {
                    appState.payments[paymentName].cuenta2 = toAccount;
                }
                
                updateAccountsDisplay();
                updateTotalAmount();
                addToHistory(`${paymentName} ${cuotaType} CUOTA: ${amount.toFixed(2)} de ${fromAccount} → ${toAccount}`);
                closeModal();
                saveState();
            } else {
                alert('Error en la transferencia de cuota. Verifique saldo y cuentas.');
            }
        }

        // Cambiar estado de pago
        function togglePaymentStatus(paymentName) {
            const payment = appState.payments[paymentName];
            
            if (payment.status === 'EN ESPERA') {
                // Cambiar a PAGADO y procesar el débito final
                const totalAmount = payment.cuota1 + payment.cuota2;
                const cuentaFinal = payment.cuenta2 || payment.cuenta1; // Usar cuenta2 si existe, sino cuenta1
                
                if (cuentaFinal && appState.accounts[cuentaFinal] >= totalAmount) {
                    appState.accounts[cuentaFinal] -= totalAmount;
                    payment.status = 'PAGADO';
                    
                    updateAccountsDisplay();
                    updateTotalAmount();
                    updatePaymentsTable();
                    addToHistory(`${paymentName} PAGADO: -${totalAmount.toFixed(2)} desde ${cuentaFinal}`);
                    saveState();
                } else {
                    alert('Saldo insuficiente para completar el pago');
                }
            } else {
                // Cambiar de PAGADO a EN ESPERA (revertir pago)
                const totalAmount = payment.cuota1 + payment.cuota2;
                const cuentaFinal = payment.cuenta2 || payment.cuenta1;
                
                if (cuentaFinal) {
                    appState.accounts[cuentaFinal] += totalAmount;
                    payment.status = 'EN ESPERA';
                    
                    updateAccountsDisplay();
                    updateTotalAmount();
                    updatePaymentsTable();
                    addToHistory(`${paymentName} REVERTIDO: +${totalAmount.toFixed(2)} a ${cuentaFinal}`);
                    saveState();
                }
            }
        }

        // Actualizar tabla de pagos
        function updatePaymentsTable() {
            const tbody = document.getElementById('paymentsTableBody');
            tbody.innerHTML = '';
            
            Object.keys(appState.payments).forEach(paymentName => {
                const payment = appState.payments[paymentName];
                const row = document.createElement('div');
                row.className = 'table-row';
                
                const statusClass = payment.status === 'PAGADO' ? 'status-pagado' : 'status-en-espera';
                const totalAmount = payment.cuota1 + payment.cuota2;
                
                row.innerHTML = `
                    <div class="table-cell payment-item">${paymentName}</div>
                    <div class="table-cell cuota-cell" onclick="openCuotaModal('${paymentName}', '1RA', ${payment.cuota1})">$${payment.cuota1.toFixed(2)}</div>
                    <div class="table-cell cuota-cell" onclick="openCuotaModal('${paymentName}', '2DA', ${payment.cuota2})">$${payment.cuota2.toFixed(2)}</div>
                    <div class="table-cell">$${totalAmount.toFixed(2)}</div>
                    <div class="table-cell">
                        <span class="${statusClass}" onclick="togglePaymentStatus('${paymentName}')">${payment.status}</span>
                    </div>
                    <div class="table-cell">
                        <button class="delete-payment" onclick="deletePayment('${paymentName}')">X</button>
                    </div>
                `;
                
                tbody.appendChild(row);
            });
        }

        // Agregar nuevo pago recurrente
        function addRecurringPayment() {
            const name = prompt('Nombre del nuevo pago recurrente:')?.toUpperCase().trim();
            if (name && !appState.payments[name]) {
                const cuota1 = parseFloat(prompt('Monto de la primera cuota:') || '0');
                const cuota2 = parseFloat(prompt('Monto de la segunda cuota:') || '0');
                
                appState.payments[name] = {
                    cuota1: cuota1,
                    cuota2: cuota2,
                    status: 'EN ESPERA',
                    cuenta1: null,
                    cuenta2: null
                };
                
                updatePaymentsTable();
                addToHistory(`Nuevo pago recurrente agregado: ${name} (${cuota1.toFixed(2)} + ${cuota2.toFixed(2)})`);
                saveState();
            }
        }

        // Eliminar pago recurrente
        function deletePayment(paymentName) {
            if (confirm(`¿Estás seguro de eliminar el pago recurrente ${paymentName}?`)) {
                delete appState.payments[paymentName];
                updatePaymentsTable();
                addToHistory(`Pago recurrente eliminado: ${paymentName}`);
                saveState();
            }
        }

        // Limpiar todos los pagos recurrentes
        function clearAllPayments() {
            if (confirm('¿Estás seguro de eliminar todos los pagos recurrentes?')) {
                appState.payments = {};
                updatePaymentsTable();
                addToHistory('Todos los pagos recurrentes eliminados');
                saveState();
            }
        }

        // Agregar entrada al historial
        function addToHistory(text) {
            const now = new Date();
            const timestamp = `${now.toLocaleDateString()} ${now.toLocaleTimeString()}`;
            appState.history.unshift(`${timestamp}: ${text}`);
            
            // Mantener solo los últimos 50 registros
            if (appState.history.length > 50) {
                appState.history = appState.history.slice(0, 50);
            }
            
            updateHistorial();
        }

        // Actualizar historial
        function updateHistorial() {
            const container = document.getElementById('historialContainer');
            container.innerHTML = '';
            
            appState.history.forEach(item => {
                const div = document.createElement('div');
                div.className = 'historial-item';
                div.textContent = item;
                container.appendChild(div);
            });
        }

        // Cerrar modal
        function closeModal() {
            document.getElementById('actionModal').style.display = 'none';
        }

        // Exportar a CSV
        function exportToCSV() {
            let csvContent = "data:text/csv;charset=utf-8,";
            
            // Encabezados
            csvContent += "CUENTA,SALDO\n";
            
            // Datos de cuentas
            Object.keys(appState.accounts).forEach(account => {
                csvContent += `${account},${appState.accounts[account]}\n`;
            });
            
            csvContent += "\nPAGO RECURRENTE,1RA CUOTA,2DA CUOTA,ESTADO\n";
            
            // Datos de pagos recurrentes
            Object.keys(appState.payments).forEach(payment => {
                const p = appState.payments[payment];
                csvContent += `${payment},${p.cuota1},${p.cuota2},${p.status}\n`;
            });
            
            // Crear enlace de descarga
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `finanzas_${new Date().toISOString().slice(0,10)}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            addToHistory('Datos exportados a CSV');
        }

        // Backup de datos en localStorage
        function backupData() {
            localStorage.setItem('finanzas_backup', JSON.stringify(appState));
            alert('Backup creado correctamente. Los datos se restaurarán automáticamente al abrir la aplicación.');
            addToHistory('Backup de datos creado');
        }

        // Restaurar backup desde localStorage
        function restoreBackup() {
            if (confirm('¿Estás seguro de restaurar el último backup? Se perderán los datos actuales.')) {
                const backup = localStorage.getItem('finanzas_backup');
                if (backup) {
                    appState = JSON.parse(backup);
                    initApp();
                    addToHistory('Backup restaurado correctamente');
                } else {
                    alert('No hay backup disponible para restaurar');
                }
            }
        }

        // Descargar backup como archivo
        function backupToFile() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appState, null, 2));
            const downloadAnchorNode = document.createElement('a');
            downloadAnchorNode.setAttribute("href", dataStr);
            downloadAnchorNode.setAttribute("download", `finanzas_backup_${new Date().toISOString().slice(0,10)}.json`);
            document.body.appendChild(downloadAnchorNode);
            downloadAnchorNode.click();
            downloadAnchorNode.remove();
            addToHistory('Backup descargado como archivo');
        }

        // Cargar backup desde archivo
        function restoreFromFile() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            
            input.onchange = e => {
                const file = e.target.files[0];
                const reader = new FileReader();
                
                reader.onload = function(event) {
                    try {
                        const backupData = JSON.parse(event.target.result);
                        if (confirm('¿Estás seguro de cargar este backup? Se perderán los datos actuales.')) {
                            appState = backupData;
                            initApp();
                            addToHistory('Backup cargado desde archivo');
                        }
                    } catch (error) {
                        alert('Error al cargar el archivo. Verifica que sea un backup válido.');
                    }
                };
                
                reader.readAsText(file);
            };
            
            input.click();
        }

        // Limpiar todos los datos
        function clearAllData() {
            if (confirm('¿Estás seguro de limpiar todos los datos? Esta acción no se puede deshacer.')) {
                appState = {
                    accounts: {},
                    payments: {},
                    history: [],
                    currentMonth: new Date().getMonth(),
                    currentYear: new Date().getFullYear()
                };
                localStorage.removeItem('finanzas_state');
                localStorage.removeItem('finanzas_backup');
                initApp();
                addToHistory('Todos los datos han sido limpiados');
            }
        }

        // Guardar estado en localStorage
        function saveState() {
            localStorage.setItem('finanzas_state', JSON.stringify(appState));
        }

        // Cargar estado desde localStorage
        function loadState() {
            const savedState = localStorage.getItem('finanzas_state');
            if (savedState) {
                appState = JSON.parse(savedState);
            }
            // Si no hay datos guardados, la aplicación comenzará con cuentas vacías
        }

        // Inicializar la aplicación cuando se carga la página
        window.onload = initApp;
    </script>
</body>
</html>
